name: JustBashPhone
options:
  bundleIdPrefix: com.mweinbach
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
packages:
  JustBashPackage:
    path: ../..
targets:
  JustBashPhone:
    type: application
    platform: iOS
    sources:
      - path: JustBashPhone
    dependencies:
      - package: JustBashPackage
        product: JustBash
      - package: JustBashPackage
        product: JustBashJavaScript
      - framework: ../../Vendor/BeeWare/Python.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mweinbach.JustBashPhone
        PRODUCT_NAME: JustBashPhone
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Just Bash
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: "\"JustBashPhone/Preview Content\""
        SWIFT_INCLUDE_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/../../Vendor/BeeWare/Python.xcframework/ios-arm64/include/python3.14
        SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/../../Vendor/BeeWare/Python.xcframework/ios-arm64_x86_64-simulator/include/python3.14
    postBuildScripts:
      - name: Stage BeeWare Python Home
        script: |
          set -euo pipefail
          PYTHON_ROOT="${SRCROOT}/../../Vendor/BeeWare/Python.xcframework"
          DEST_ROOT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/python"

          if [[ "${PLATFORM_NAME}" == "iphoneos" ]]; then
            SLICE_SRC="${PYTHON_ROOT}/ios-arm64"
            STDLIB_SRC="${SLICE_SRC}/lib-arm64/python3.14"
          else
            if [[ "${CURRENT_ARCH}" == "x86_64" ]]; then
              SLICE_SRC="${PYTHON_ROOT}/ios-arm64_x86_64-simulator"
              STDLIB_SRC="${SLICE_SRC}/lib-x86_64/python3.14"
            else
              SLICE_SRC="${PYTHON_ROOT}/ios-arm64_x86_64-simulator"
              STDLIB_SRC="${SLICE_SRC}/lib-arm64/python3.14"
            fi
          fi

          rm -rf "${DEST_ROOT}"
          mkdir -p "${DEST_ROOT}"
          cp -R "${SLICE_SRC}/bin" "${DEST_ROOT}/bin"
          cp -R "${SLICE_SRC}/include" "${DEST_ROOT}/include"
          cp -R "${SLICE_SRC}/platform-config" "${DEST_ROOT}/platform-config"
          mkdir -p "${DEST_ROOT}/lib"
          cp "${SLICE_SRC}/lib/libpython3.14.dylib" "${DEST_ROOT}/lib/libpython3.14.dylib"
          cp -R "${PYTHON_ROOT}/lib/python3.14" "${DEST_ROOT}/lib/python3.14"
          cp -R "${STDLIB_SRC}/." "${DEST_ROOT}/lib/python3.14"
          APP_SRC="${SRCROOT}/PythonApp"
          APP_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/app"
          rm -rf "${APP_DEST}"
          mkdir -p "${APP_DEST}"
          if [[ -d "${APP_SRC}" ]]; then
            cp -R "${APP_SRC}/." "${APP_DEST}"
          fi
schemes:
  JustBashPhone:
    build:
      targets:
        JustBashPhone: all
    run:
      config: Debug
    archive:
      config: Release
