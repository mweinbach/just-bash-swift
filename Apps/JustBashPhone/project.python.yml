name: JustBashPhone
options:
  bundleIdPrefix: com.mweinbach
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
packages:
  JustBashPackage:
    path: ../..
targets:
  JustBashPhone:
    type: application
    platform: iOS
    sources:
      - path: JustBashPhone
    dependencies:
      - package: JustBashPackage
        product: JustBash
      - package: JustBashPackage
        product: JustBashJavaScript
      - framework: ../../Vendor/BeeWare/Python.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mweinbach.JustBashPhone
        PRODUCT_NAME: JustBashPhone
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Just Bash
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: "\"JustBashPhone/Preview Content\""
        SWIFT_INCLUDE_PATHS[sdk=iphoneos*]:
          - $(SRCROOT)/../../Vendor/BeeWare/Python.xcframework/ios-arm64/include/python3.14
        SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]:
          - $(SRCROOT)/../../Vendor/BeeWare/Python.xcframework/ios-arm64_x86_64-simulator/include/python3.14
    postBuildScripts:
      - name: Stage BeeWare Python Home
        script: |
          set -euo pipefail
          PYTHON_ROOT="${SRCROOT}/../../Vendor/BeeWare/Python.xcframework"
          DEST_ROOT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PythonSupport"

          if [[ "${PLATFORM_NAME}" == "iphoneos" ]]; then
            LIB_SRC="${PYTHON_ROOT}/ios-arm64/lib-arm64/python3.14"
          else
            if [[ "${CURRENT_ARCH}" == "x86_64" ]]; then
              LIB_SRC="${PYTHON_ROOT}/ios-arm64_x86_64-simulator/lib-x86_64/python3.14"
            else
              LIB_SRC="${PYTHON_ROOT}/ios-arm64_x86_64-simulator/lib-arm64/python3.14"
            fi
          fi

          rm -rf "${DEST_ROOT}"
          mkdir -p "${DEST_ROOT}/lib"
          cp -R "${LIB_SRC}" "${DEST_ROOT}/lib/python3.14"
schemes:
  JustBashPhone:
    build:
      targets:
        JustBashPhone: all
    run:
      config: Debug
    archive:
      config: Release
