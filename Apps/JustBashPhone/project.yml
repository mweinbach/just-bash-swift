name: JustBashPhone
options:
  bundleIdPrefix: com.mweinbach
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
packages:
  JustBashPackage:
    path: ../..
  SwiftCodexCorePackage:
    path: ../../../SwiftCodexCore
targets:
  JustBashPhone:
    type: application
    platform: iOS
    sources:
      - path: JustBashPhone
    dependencies:
      - package: JustBashPackage
        product: JustBash
      - package: JustBashPackage
        product: JustBashJavaScript
      - package: SwiftCodexCorePackage
        product: CodexCore
      - package: SwiftCodexCorePackage
        product: CodexCoreJustBash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mweinbach.JustBashPhone
        PRODUCT_NAME: JustBashPhone
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Just Bash
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: "\"JustBashPhone/Preview Content\""
schemes:
  JustBashPhone:
    build:
      targets:
        JustBashPhone: all
    run:
      config: Debug
    archive:
      config: Release
